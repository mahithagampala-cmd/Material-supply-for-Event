<section><h1>Material Request Form</h1><form id="requestForm"><label>Name</label><input required placeholder="Enter your name"><label>Phone</label><input required type="tel" placeholder="Enter phone number"><label>Event Type</label><select required><option value="">Select event</option><option>College Event</option><option>Wedding</option><option>Birthday</option><option>Corporate Event</option><option>Exhibition</option></select><label>Event Date</label><input required type="date"><label>Materials Required</label><textarea required placeholder="Example: 100 chairs, 10 tables, 2 banners"></textarea><label>Additional Details</label><textarea placeholder="Delivery location or special requirements"></textarea><button class="btn" type="submit">Submit Request</button><p id="msg"></p></form></section>
<script>document.getElementById('requestForm').onsubmit=e=>{e.preventDefault();document.getElementById('msg').textContent='Request prepared successfully! This demo form does not send data to a server.';e.target.reset();}</script>
</main>
